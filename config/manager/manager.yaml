---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: redis-operator
  name: ot-operators
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-operator
  namespace: ot-operators
  labels:
    control-plane: redis-operator
spec:
  selector:
    matchLabels:
      control-plane: redis-operator
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: redis-operator
    spec:
      securityContext:
        runAsNonRoot: true
      tolerations:
      - key: "node-operator"
        value: "true"
        operator: "Equal"
        effect: "NoSchedule"
      nodeSelector:
        "node-operator-label": "true"
      containers:
      - command:
        - /operator
        - manager
        env:
          - name: ENABLE_WEBHOOKS
            value: "false"
        args:
        - --leader-elect
        - --zap-log-level=debug
        - --enable-webhooks=false
        image: controller
        imagePullPolicy: IfNotPresent
        name: manager
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            cpu: 25m
            memory: 25Mi
      terminationGracePeriodSeconds: 10
      serviceAccount: redis-operator
      serviceAccountName: redis-operator
